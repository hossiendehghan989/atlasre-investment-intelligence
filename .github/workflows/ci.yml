name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock -r requirements-test.txt
      - name: Run Ruff
        run: ruff check .
      - name: Run tests with coverage
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasre-coverage
          path: coverage.xml
          if-no-files-found: ignore
