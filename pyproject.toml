# Project metadata and shared Ruff and pytest tool configuration.
[project]
name = "atlasre-investment-intelligence"
version = "0.11.0"
description = "Transparent real-estate underwriting and investment committee decision support"
requires-python = ">=3.11,<3.13"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["artifacts", ".pytest_cache", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
